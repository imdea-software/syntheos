[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shield"
version = "0.1.0"
description = "Runtime shield for a Mealy machine synthesized by Syntheos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ply==3.11",
    "PyYAML==6.0.2",
    "z3-solver==4.14.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "mypy>=1.10",
    "types-PyYAML",
    "ruff>=0.6",
]

[project.scripts]
shield = "shield.cli:main"

[tool.setuptools.packages.find]
include = ["shield*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["shield"]
exclude = ["shield/parsetab\\.py"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

# z3 and ply ship no type stubs (and are used heavily via loosely-typed APIs
# / a deliberate `from z3 import *` re-export seam in z3_support.py) - holding
# the rest of the codebase to strict typing while pretending these are fully
# typed would just produce noise.
[[tool.mypy.overrides]]
module = ["z3", "z3.*", "ply", "ply.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
extend-exclude = ["shield/parsetab.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern syntax)
    "B",   # flake8-bugbear (common bug patterns)
    "C4",  # flake8-comprehensions
]
ignore = [
    "E741",  # ambiguous variable name - "l" for a literal id is established local vocabulary here
]
